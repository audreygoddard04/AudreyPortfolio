    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      No static <meta name="description"> or <title> here — every route
      sets its own via the <SEO> component (src/components/SEO.jsx) and
      react-helmet-async, and react-scripts build's prerender step
      (scripts/prerender.js) bakes the rendered tags into the static HTML
      for each route. A duplicate static tag here would sit alongside
      Helmet's version instead of being replaced by it.
    -->
    <title>Audrey Goddard | Science, Systems, Business & the Built World</title>
  </head>
